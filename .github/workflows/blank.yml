name: Lancer le Bot TikTok

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lancer le script de contenu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_content.py

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historique.json
          git diff --staged --quiet || (git commit -m "maj historique" && git push)

      - name: Garder le résultat en artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contenu-du-jour
          path: |
            historique.json
            sortie/
          if-no-files-found: ignore 
