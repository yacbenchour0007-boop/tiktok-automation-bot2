name: Lancer le Bot TikTok

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'audio
        run: python generate_audio.py

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historique.json
          git diff --staged --quiet || (git commit -m "maj historique" && git push)

      - name: Garder l'audio en artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audio-du-jour
          path: sortie/
          retention-days: 7
          if-no-files-found: error
